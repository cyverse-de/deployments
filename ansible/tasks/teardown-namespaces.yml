---
# Deletes a set of namespaces, in stages rather than one blocking delete.
#
# A single `state: absent` with `wait: true` per namespace is what this
# replaces, and it fails in a way that costs the whole play: an operator's
# custom resources carry finalizers only that operator's controller clears, and
# deleting the namespace takes the controller with it. Anything still
# finalizing then has nothing left to release it, so the namespace sits in
# Terminating forever, the task burns its timeout and fails, and every task
# after it — including the CRD cleanup — never runs.
#
# So: clear the known offenders while their controllers are still up, start all
# the deletions without blocking, give them a grace period, then release
# whatever is still held before waiting for real. The recovery step is also
# what rescues a namespace a previous run already wedged.
#
# Expects: teardown_namespaces (list of names).
#
# Note on `until` with `loop`: the condition is evaluated per item, against
# that item's own result — which has `.resources`, not `.results`. Writing it
# against `.results` makes the expression undefined per item, `default([])`
# turns that into an empty list, and the wait passes immediately every time.

- name: Delete the custom resources whose controllers clear their finalizers
  kubernetes.core.k8s:
    state: absent
    delete_all: true
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.namespace }}"
    wait: true
    wait_timeout: 120
  loop: "{{ local_teardown_finalizer_resources
            | selectattr('namespace', 'in', teardown_namespaces) | list }}"
  loop_control:
    label: "{{ item.kind }} in {{ item.namespace }}"
  # Best-effort: the CRD may not be installed, or the controller may already be
  # gone from a previous partial run. The recovery step below is what actually
  # guarantees the namespace can finish.
  failed_when: false

- name: Start deleting the namespaces
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    wait: false
  loop: "{{ teardown_namespaces }}"

# A grace period, not the real wait: most namespaces go on their own within it,
# and the ones that do not are the ones the recovery step exists for. Failure
# here is uninteresting, so it is suppressed.
- name: Give the namespaces a chance to terminate on their own
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
  loop: "{{ teardown_namespaces }}"
  loop_control:
    label: "{{ item }}"
  register: teardown_ns_grace
  until: teardown_ns_grace.resources | default([]) | length == 0
  retries: "{{ teardown_grace_retries | default(20) }}"
  delay: 15
  failed_when: false

# One un-looped lookup, so the result is a plain list rather than a per-item
# register that the expressions above have to reach into differently.
- name: Look up which namespaces are still terminating
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
  register: teardown_ns_all

- name: Record the namespaces that did not finish
  ansible.builtin.set_fact:
    teardown_ns_stuck: "{{ teardown_ns_all.resources | default([])
      | map(attribute='metadata.name') | select('in', teardown_namespaces) | list }}"

- name: Report the namespaces that need their finalizers released
  ansible.builtin.debug:
    msg: >-
      Still terminating after the grace period:
      {{ teardown_ns_stuck | join(', ') if teardown_ns_stuck | length > 0 else 'none' }}

- name: Find the custom resources still holding a terminating namespace open
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.namespace }}"
  loop: "{{ local_teardown_finalizer_resources
            | selectattr('namespace', 'in', teardown_ns_stuck) | list }}"
  loop_control:
    label: "{{ item.kind }} in {{ item.namespace }}"
  register: teardown_stuck_resources
  failed_when: false

# merge_type: merge (RFC 7386) replaces the array wholesale, which is the only
# way to empty it — a strategic merge patch can add finalizers but never remove
# them. With the finalizers gone the API server completes the delete that was
# already requested, and the namespace follows within a few seconds.
- name: Release the finalizers their controller is no longer around to clear
  kubernetes.core.k8s:
    state: patched
    merge_type: merge
    api_version: "{{ item.0.item.api_version }}"
    kind: "{{ item.0.item.kind }}"
    namespace: "{{ item.1.metadata.namespace }}"
    name: "{{ item.1.metadata.name }}"
    definition:
      metadata:
        finalizers: []
  loop: "{{ teardown_stuck_resources.results | default([])
            | rejectattr('skipped', 'defined')
            | subelements('resources', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.item.kind }}/{{ item.1.metadata.name }}"

- name: Wait for the namespaces to go
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
  loop: "{{ teardown_namespaces }}"
  loop_control:
    label: "{{ item }}"
  register: teardown_ns_final
  until: teardown_ns_final.resources | default([]) | length == 0
  retries: 40
  delay: 15
