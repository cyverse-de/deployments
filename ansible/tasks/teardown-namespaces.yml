---
# Deletes a set of namespaces, in three steps rather than one blocking delete.
#
# A single `state: absent` with `wait: true` per namespace is what this
# replaces, and it fails in a way that costs the whole play: an operator's
# custom resources carry finalizers only that operator's controller clears, and
# deleting the namespace takes the controller with it. Anything still
# finalizing then has nothing left to release it, so the namespace sits in
# Terminating forever, the task burns its timeout and fails, and every task
# after it — including the CRD cleanup — never runs.
#
# So: clear the known offenders while their controllers are still up, start all
# the deletions without blocking, then release whatever is still held before
# waiting. The last step is what recovers a namespace already wedged by an
# earlier run.
#
# Expects: teardown_namespaces (list of names).

- name: Delete the custom resources whose controllers clear their finalizers
  kubernetes.core.k8s:
    state: absent
    delete_all: true
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.namespace }}"
    wait: true
    wait_timeout: 120
  loop: "{{ local_teardown_finalizer_resources
            | selectattr('namespace', 'in', teardown_namespaces) | list }}"
  loop_control:
    label: "{{ item.kind }} in {{ item.namespace }}"
  # Best-effort: the CRD may not be installed, or the controller may already be
  # gone from a previous partial run. Either way the recovery step below is
  # what guarantees the namespace can finish.
  failed_when: false

- name: Start deleting the namespaces
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    wait: false
  loop: "{{ teardown_namespaces }}"

# Everything below runs against namespaces that are already Terminating, so
# nothing here can prolong a deletion that would otherwise have succeeded.
- name: Look up the namespaces that have not finished terminating
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
  loop: "{{ teardown_namespaces }}"
  loop_control:
    label: "{{ item }}"
  register: teardown_ns_remaining
  until: >-
    (teardown_ns_remaining.results | default([]) | map(attribute='resources')
     | flatten | length) == 0
  retries: 20
  delay: 15
  failed_when: false

- name: Find the custom resources still holding a terminating namespace open
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.namespace }}"
  loop: "{{ local_teardown_finalizer_resources
            | selectattr('namespace', 'in', teardown_namespaces) | list }}"
  loop_control:
    label: "{{ item.kind }} in {{ item.namespace }}"
  register: teardown_stuck_resources
  when: teardown_ns_stuck | length > 0
  failed_when: false
  vars:
    teardown_ns_stuck: >-
      {{ teardown_ns_remaining.results | default([])
         | map(attribute='resources') | flatten
         | map(attribute='metadata.name') | list }}

# merge_type: merge (RFC 7386) replaces the array wholesale, which is the only
# way to empty it — a strategic merge patch can add finalizers but not remove
# them. With the finalizers gone the API server completes the delete that was
# already requested, and the namespace follows within a few seconds.
- name: Release the finalizers their controller is no longer around to clear
  kubernetes.core.k8s:
    state: patched
    merge_type: merge
    api_version: "{{ item.0.item.api_version }}"
    kind: "{{ item.0.item.kind }}"
    namespace: "{{ item.1.metadata.namespace }}"
    name: "{{ item.1.metadata.name }}"
    definition:
      metadata:
        finalizers: []
  loop: "{{ teardown_stuck_resources.results | default([])
            | rejectattr('skipped', 'defined')
            | subelements('resources', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.item.kind }}/{{ item.1.metadata.name }}"

- name: Wait for the namespaces to go
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
  loop: "{{ teardown_namespaces }}"
  loop_control:
    label: "{{ item }}"
  register: teardown_ns_final
  until: >-
    (teardown_ns_final.results | default([]) | map(attribute='resources')
     | flatten | length) == 0
  retries: 40
  delay: 15
