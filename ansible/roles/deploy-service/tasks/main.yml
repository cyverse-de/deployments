---
- name: Deploy service via skaffold
  tags:
    - deploy
  block:
    - name: Builds dir
      delegate_to: localhost
      ansible.builtin.debug:
        msg: "{{ build_json_dir }}"

    - name: Show the immediate parent's path
      debug:
        msg: "My parent is at {{ ansible_parent_role_paths[0] }}"

    - name: read the build JSON file
      delegate_to: localhost
      set_fact:
        build_json_path: "{{ build_json_dir + '/' + project_name + '.json'}}"
        build_json: "{{ lookup('file', build_json_dir +'/' + project_name + '.json') | from_json }}"

    - name: Image tag
      delegate_to: localhost
      ansible.builtin.debug:
        msg: "{{ build_json.builds[0].tag }}"

    - name: Check for a manifest template
      delegate_to: localhost
      run_once: true
      ansible.builtin.stat:
        path: "{{ ansible_parent_role_paths[0] }}/templates/k8s/{{ manifest_file }}.j2"
      register: manifest_tpl

    # The rendered manifests are git-ignored, so on a fresh clone the
    # destination directory doesn't exist and the template task would fail.
    - name: Ensure the rendered-manifest directory exists
      delegate_to: localhost
      run_once: true
      when: manifest_tpl.stat.exists
      ansible.builtin.file:
        path: "{{ skaffold_dir }}/k8s"
        state: directory
        mode: "0755"

    # Render replicas/anti-affinity from role vars into the manifest skaffold reads.
    # Guarded so deploy-service still works for callers without a template.
    - name: Render the Kubernetes manifest
      delegate_to: localhost
      run_once: true
      when: manifest_tpl.stat.exists
      ansible.builtin.template:
        src: "{{ ansible_parent_role_paths[0] }}/templates/k8s/{{ manifest_file }}.j2"
        dest: "{{ skaffold_dir }}/k8s/{{ manifest_file }}"
        mode: "0644"

    # deploy_wait: false applies the manifest and returns instead of blocking
    # on rollout. Deploying many services that way turns N sequential waits
    # into one concurrent one, which is where the wall-clock goes — the caller
    # is then responsible for waiting (see deploy_it.yml).
    - name: Run skaffold deploy
      delegate_to: localhost
      run_once: true
      ansible.builtin.command:
        chdir: "{{ skaffold_dir }}"
        cmd: >
          skaffold deploy
          --namespace "{{ deploy_ns | default(ns) }}"
          --build-artifacts "{{ build_json_path }}"
          --force
          --kubeconfig "{{ kubeconfig }}"
          --status-check={{ deploy_wait | bool | lower }}
          {% if deploy_run_id | default('', true) | length > 0 -%}
          --label skaffold.dev/run-id={{ deploy_run_id }}
          {% endif -%}
          {% if deploy_profile is defined -%}
          --profile {{ deploy_profile }}
          {%- endif -%}
      register: deploy_service_result
      # A bare command always reports changed, which makes a deploy's changed
      # count say nothing. Skaffold ends each resource line with the verb
      # kubectl applied — "unchanged", "configured", "created" — so the no-op
      # case is detectable. Match on those verbs rather than on the leading
      # bullet: the "Tags used in deployment" section is bulleted too, and its
      # lines never end in a verb. Recognising no resource lines at all counts
      # as changed, so an output format we stop understanding errs towards
      # reporting a change rather than hiding one.
      changed_when: >-
        deploy_service_result.rc == 0 and
        ((deploy_service_result.stdout_lines | default([])
          | select('search', '(unchanged|configured|created|deleted)$')
          | list | length) == 0
         or (deploy_service_result.stdout_lines | default([])
             | select('search', '(configured|created|deleted)$')
             | list | length) > 0)
      # With deploy_continue_on_error the run records the failure and carries
      # on, so one broken service does not truncate the rest of the list. The
      # caller reports every failure at the end and exits non-zero.
      failed_when:
        - deploy_service_result.rc != 0
        - not (deploy_continue_on_error | bool)

    - name: Record the failed deploy
      delegate_to: localhost
      run_once: true
      when: deploy_service_result.rc != 0
      ansible.builtin.set_fact:
        deploy_failed_services: "{{ deploy_failed_services | default([]) + [project_name] }}"
