---
# The roles that create the endpoint certificates check their own provider, but
# some of them (harbor, keycloak_install, grafana) run only when their tag is
# given explicitly, so a typo there could otherwise go unnoticed for a long time.
# cert_manager_provider is checked too, even when every endpoint overrides it.
- name: Validate the certificate providers
  vars:
    cluster_issuers_invalid_providers: >-
      {{ {'cert_manager_provider': cert_manager_provider}
         | combine(cert_manager_endpoint_provider_settings) | dict2items
         | rejectattr('value', 'in', cert_manager_supported_providers) | items2dict }}
  ansible.builtin.assert:
    that: cluster_issuers_invalid_providers | length == 0
    fail_msg: >-
      Unsupported certificate provider(s): {{ cluster_issuers_invalid_providers }}.
      Each must be one of {{ cert_manager_supported_providers | join(', ') }}; the
      per-endpoint *_tls_provider variables default to cert_manager_provider.
    quiet: true

- name: Apply cluster-scoped self-signed issuer
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  when: cluster_issuer_default_type == 'selfSigned'
  block:
    - name: Apply default-cluster-issuer
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: default-cluster-issuer
          spec:
            selfSigned: {}

- name: Apply cluster-scoped issuer backed by an existing CA
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  when: cluster_issuer_default_type == 'ca'
  block:
    # The private key of this CA can mint certificates that every client
    # trusting the CA will accept, so anyone able to read secrets in the
    # cert-manager namespace effectively holds the CA.
    - name: Load the CA keypair into the cert-manager namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ cluster_issuer_ca_secret_name }}"
            namespace: cert-manager
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ lookup('file', cluster_issuer_ca_cert_file) | b64encode }}"
            tls.key: "{{ lookup('file', cluster_issuer_ca_key_file) | b64encode }}"
      # The definition holds the CA private key, so a -v run or a logging
      # callback would otherwise write it to wherever that output goes.
      no_log: true

    - name: Apply default-cluster-issuer
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: default-cluster-issuer
          spec:
            ca:
              secretName: "{{ cluster_issuer_ca_secret_name }}"

- name: Apply Let's Encrypt issuer
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  when: "'letsencrypt' in cert_manager_endpoint_providers"
  block:
    - name: Create the route53 credentials secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ cert_manager_le_aws_creds_secret_name }}"
            namespace: cert-manager
          type: Opaque
          data:
            access-key-id: "{{ cert_manager_le_aws_access_key_id | b64encode }}"
            secret-access-key: "{{ cert_manager_le_aws_secret_access_key | b64encode }}"

    - name: Generate the Let's Encrypt ClusterIssuer
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: "{{ cert_manager_le_issuer_name }}"
          spec:
            acme:
              email: "{{ cert_manager_le_issuer_email }}"
              profile: tlsserver
              server: "{{ cert_manager_le_issuer_acme_server }}"
              privateKeySecretRef:
                name: "{{ cert_manager_le_issuer_acme_secret_name }}"
              solvers:
                - dns01:
                    cnameStrategy: Follow
                    route53:
                      region: "{{ cert_manager_le_aws_region }}"
                      accessKeyIDSecretRef:
                        name: "{{ cert_manager_le_aws_creds_secret_name }}"
                        key: access-key-id
                      secretAccessKeySecretRef:
                        name: "{{ cert_manager_le_aws_creds_secret_name }}"
                        key: secret-access-key
