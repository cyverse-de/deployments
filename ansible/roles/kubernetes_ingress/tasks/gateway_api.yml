---
- name: Configure gateway API resources for the DE
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    - name: Create the TLS certificate for the DE
      ansible.builtin.include_role:
        name: tls_certificate
      vars:
        tls_certificate_name: "{{ de_tls_cert_name }}"
        tls_certificate_provider: "{{ de_tls_provider }}"
        tls_certificate_namespace: "{{ ns }}"
        tls_certificate_hostnames:
          - "{{ de_hostname }}"
        tls_certificate_duration: "{{ de_tls_cert_duration }}"
        tls_certificate_renew_before: "{{ de_tls_cert_renew_before }}"
        tls_certificate_issuer_name: "{{ de_tls_issuer_name }}"
        tls_certificate_ca_name: "{{ de_tls_ca_name }}"
        tls_certificate_ca_duration: "{{ de_tls_ca_duration }}"
        tls_certificate_ca_renew_before: "{{ de_tls_ca_renew_before }}"
        tls_certificate_pem: "{{ de_tls_cert_pem }}"
        tls_certificate_key_pem: "{{ de_tls_cert_key_pem }}"

    - name: Define the gateway for the DE
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: discoenv
            namespace: "{{ ns }}"
          spec:
            gatewayClassName: "{{ gateway_class_name }}"
            listeners:
              - hostname: "{{ de_hostname }}"
                name: discoenv-http
                port: 8000
                protocol: HTTP
              - hostname: "{{ de_hostname }}"
                name: discoenv-https
                port: 8443
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      group: ""
                      name: "{{ de_tls_cert_name }}"

    - name: Define the CORS middleware for the DE
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: discoenv-cors-headers
            namespace: "{{ ns }}"
          spec:
            headers:
              accessControlAllowOriginList:
                - "*"
              accessControlAllowMethods:
                - "GET"
                - "POST"
                - "OPTIONS"
              accessControlAllowHeaders:
                - "Authorization"
                - "DNT"
                - "Keep-Alive"
                - "User-Agent"
                - "X-Requested-With"
                - "If-Modified-Since"
                - "Cache-Control"
                - "Content-Type"
                - "Content-Range"
                - "Range"
              accessControlAllowCredentials: true
              accessControlMaxAge: 86400
      when: gateway_provider == "traefik"

    - name: Define the CORS middleware for VICE
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: vice-cors-headers
            namespace: "{{ vice_ns }}"
          spec:
            headers:
              accessControlAllowOriginList:
                - "*"
              accessControlAllowMethods:
                - "GET"
                - "POST"
                - "OPTIONS"
              accessControlAllowHeaders:
                - "Authorization"
                - "DNT"
                - "Keep-Alive"
                - "User-Agent"
                - "X-Requested-With"
                - "If-Modified-Since"
                - "Cache-Control"
                - "Content-Type"
                - "Content-Range"
                - "Range"
              accessControlAllowCredentials: true
              accessControlMaxAge: 86400
      when: gateway_provider == "traefik"

    - name: Define the routes for the DE when the gateway provider is Traefik
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: discoenv-routes
            namespace: "{{ ns }}"
          spec:
            hostnames:
              - "{{ de_hostname }}"
            parentRefs:
              - name: discoenv
            rules:
              - backendRefs:
                  - name: kifshare
                    port: 80
                filters:
                  - type: ExtensionRef
                    extensionRef:
                      group: traefik.io
                      kind: Middleware
                      name: discoenv-cors-headers
                matches:
                  - path:
                      type: PathPrefix
                      value: /anon-files
                timeouts:
                  request: "24h"
                  backendRequest: "24h"
              - backendRefs:
                  - name: kifshare
                    port: 80
                filters:
                  - type: ExtensionRef
                    extensionRef:
                      group: traefik.io
                      kind: Middleware
                      name: discoenv-cors-headers
                matches:
                  - path:
                      type: PathPrefix
                      value: /dl
                timeouts:
                  request: "24h"
                  backendRequest: "24h"
              - backendRefs:
                  - name: terrain
                    port: 80
                filters:
                  - type: ExtensionRef
                    extensionRef:
                      group: traefik.io
                      kind: Middleware
                      name: discoenv-cors-headers
                matches:
                  - path:
                      type: PathPrefix
                      value: /terrain
                timeouts:
                  request: "24h"
                  backendRequest: "24h"
              - backendRefs:
                  - name: job-status
                    port: 80
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      path:
                        type: ReplacePrefixMatch
                        replacePrefixMatch: /
                  - type: ExtensionRef
                    extensionRef:
                      group: traefik.io
                      kind: Middleware
                      name: discoenv-cors-headers
                matches:
                  - path:
                      type: PathPrefix
                      value: /job
              - backendRefs:
                  - name: formation
                    port: 80
                filters:
                  - type: ExtensionRef
                    extensionRef:
                      group: traefik.io
                      kind: Middleware
                      name: discoenv-cors-headers
                matches:
                  - path:
                      type: PathPrefix
                      value: /formation
              # RFC 8414/9728 root-form OAuth discovery paths for the MCP
              # server; clients derive these from the issuer URL, so they
              # must resolve at the host root rather than under /formation.
              - backendRefs:
                  - name: formation
                    port: 80
                filters:
                  - type: ExtensionRef
                    extensionRef:
                      group: traefik.io
                      kind: Middleware
                      name: discoenv-cors-headers
                matches:
                  - path:
                      type: PathPrefix
                      value: /.well-known/oauth-protected-resource/formation
                  - path:
                      type: PathPrefix
                      value: /.well-known/oauth-authorization-server/formation
                  - path:
                      type: PathPrefix
                      value: /.well-known/openid-configuration/formation
              - backendRefs:
                  - name: sonora
                    port: 80
                filters:
                  - type: ExtensionRef
                    extensionRef:
                      group: traefik.io
                      kind: Middleware
                      name: discoenv-cors-headers
                matches:
                  - path:
                      type: PathPrefix
                      value: /
                timeouts:
                  request: "24h"
                  backendRequest: "24h"
      when: gateway_provider == "traefik"

    - name: Define the routes for the DE when provider-specific customizations aren't needed.
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: discoenv-routes
            namespace: "{{ ns }}"
          spec:
            hostnames:
              - "{{ de_hostname }}"
            parentRefs:
              - name: discoenv
            rules:
              - backendRefs:
                  - name: kifshare
                    port: 80
                matches:
                  - path:
                      type: PathPrefix
                      value: /anon-files
                timeouts:
                  request: "24h"
                  backendRequest: "24h"
              - backendRefs:
                  - name: kifshare
                    port: 80
                matches:
                  - path:
                      type: PathPrefix
                      value: /dl
                timeouts:
                  request: "24h"
                  backendRequest: "24h"
              - backendRefs:
                  - name: terrain
                    port: 80
                matches:
                  - path:
                      type: PathPrefix
                      value: /terrain
                timeouts:
                  request: "24h"
                  backendRequest: "24h"
              - backendRefs:
                  - name: job-status
                    port: 80
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      path:
                        type: ReplacePrefixMatch
                        replacePrefixMatch: /
                matches:
                  - path:
                      type: PathPrefix
                      value: /job
              - backendRefs:
                  - name: formation
                    port: 80
                matches:
                  - path:
                      type: PathPrefix
                      value: /formation
              # RFC 8414/9728 root-form OAuth discovery paths for the MCP
              # server; clients derive these from the issuer URL, so they
              # must resolve at the host root rather than under /formation.
              - backendRefs:
                  - name: formation
                    port: 80
                matches:
                  - path:
                      type: PathPrefix
                      value: /.well-known/oauth-protected-resource/formation
                  - path:
                      type: PathPrefix
                      value: /.well-known/oauth-authorization-server/formation
                  - path:
                      type: PathPrefix
                      value: /.well-known/openid-configuration/formation
              - backendRefs:
                  - name: sonora
                    port: 80
                matches:
                  - path:
                      type: PathPrefix
                      value: /
                timeouts:
                  request: "24h"
                  backendRequest: "24h"
      # Add new providers to this list as providers are added so that other provider-specific routes aren't overwritten.
      when: gateway_provider not in ["traefik"]

    # Shares the DE's self-signed chain.
    - name: Create the TLS certificate for the user portal
      ansible.builtin.include_role:
        name: tls_certificate
      vars:
        tls_certificate_name: "{{ user_portal_tls_cert_name }}"
        tls_certificate_provider: "{{ user_portal_tls_provider }}"
        tls_certificate_namespace: "{{ ns }}"
        tls_certificate_hostnames:
          - "{{ portal_hostname }}"
        tls_certificate_duration: "{{ user_portal_tls_cert_duration }}"
        tls_certificate_renew_before: "{{ user_portal_tls_cert_renew_before }}"
        tls_certificate_issuer_name: "{{ de_tls_issuer_name }}"
        tls_certificate_ca_name: "{{ de_tls_ca_name }}"
        tls_certificate_ca_duration: "{{ de_tls_ca_duration }}"
        tls_certificate_ca_renew_before: "{{ de_tls_ca_renew_before }}"
        tls_certificate_pem: "{{ user_portal_tls_cert_pem }}"
        tls_certificate_key_pem: "{{ user_portal_tls_cert_key_pem }}"

    - name: Define the gateway for the user portal
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: portal
            namespace: "{{ ns }}"
          spec:
            gatewayClassName: "{{ gateway_class_name }}"
            listeners:
              - hostname: "{{ portal_hostname }}"
                name: portal-http
                port: 8000
                protocol: HTTP
              - hostname: "{{ portal_hostname }}"
                name: portal-https
                port: 8443
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      group: ""
                      name: "{{ user_portal_tls_cert_name }}"

    - name: Define the routes for the user portal
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: portal-routes
            namespace: "{{ ns }}"
          spec:
            hostnames:
              - "{{ portal_hostname }}"
            parentRefs:
              - name: portal
            rules:
              - backendRefs:
                  - name: user-portal
                    port: 3000

    # --- AI Discovery Lab (ai-sandboxes-ui) ---
    # Gated on ai_sandboxes_ui_enabled because this service is optional;
    # the hostname gate prevents creating ingress when the operator has
    # not chosen a public hostname yet.
    - name: Create the TLS certificate for the AI Discovery Lab
      when:
        - ai_sandboxes_ui_enabled | bool
        - ai2s_hostname not in ['', 'replace_me']
      ansible.builtin.include_role:
        name: tls_certificate
      vars:
        tls_certificate_name: "{{ ai2s_tls_cert_name }}"
        tls_certificate_provider: "{{ ai2s_tls_provider }}"
        tls_certificate_namespace: "{{ ns }}"
        tls_certificate_hostnames:
          - "{{ ai2s_hostname }}"
        tls_certificate_duration: "{{ ai2s_tls_cert_duration }}"
        tls_certificate_renew_before: "{{ ai2s_tls_cert_renew_before }}"
        tls_certificate_issuer_name: "{{ de_tls_issuer_name }}"
        tls_certificate_ca_name: "{{ de_tls_ca_name }}"
        tls_certificate_ca_duration: "{{ de_tls_ca_duration }}"
        tls_certificate_ca_renew_before: "{{ de_tls_ca_renew_before }}"
        tls_certificate_pem: "{{ ai2s_tls_cert_pem }}"
        tls_certificate_key_pem: "{{ ai2s_tls_cert_key_pem }}"

    - name: Define the gateway for the AI Discovery Lab
      when:
        - ai_sandboxes_ui_enabled | bool
        - ai2s_hostname not in ['', 'replace_me']
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: ai-sandboxes-ui
            namespace: "{{ ns }}"
          spec:
            gatewayClassName: "{{ gateway_class_name }}"
            listeners:
              - hostname: "{{ ai2s_hostname }}"
                name: ai-sandboxes-ui-https
                port: 8443
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      group: ""
                      name: "{{ ai2s_tls_cert_name }}"

    - name: Define the route for the AI Discovery Lab
      when:
        - ai_sandboxes_ui_enabled | bool
        - ai2s_hostname not in ['', 'replace_me']
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: ai-sandboxes-ui
            namespace: "{{ ns }}"
          spec:
            hostnames:
              - "{{ ai2s_hostname }}"
            parentRefs:
              - name: ai-sandboxes-ui
            rules:
              - backendRefs:
                  - name: ai-sandboxes-ui
                    port: 80

    - name: Create the TLS certificate for VICE
      ansible.builtin.include_role:
        name: tls_certificate
      vars:
        tls_certificate_name: "{{ vice_tls_cert_name }}"
        tls_certificate_provider: "{{ vice_tls_provider }}"
        tls_certificate_namespace: "{{ ns }}"
        tls_certificate_hostnames:
          - "{{ vice_wildcard_fqdn }}"
        tls_certificate_duration: "{{ vice_tls_cert_duration }}"
        tls_certificate_renew_before: "{{ vice_tls_cert_renew_before }}"
        tls_certificate_issuer_name: "{{ vice_tls_issuer_name }}"
        tls_certificate_ca_name: "{{ vice_tls_ca_name }}"
        tls_certificate_ca_duration: "{{ vice_tls_ca_duration }}"
        tls_certificate_ca_renew_before: "{{ vice_tls_ca_renew_before }}"
        tls_certificate_selfsigned_common_name: "*.{{ ns }}.svc.cluster.local"
        tls_certificate_pem: "{{ vice_tls_cert_pem }}"
        tls_certificate_key_pem: "{{ vice_tls_cert_key_pem }}"

    - name: Define the gateway for VICE
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: vice
            namespace: "{{ ns }}"
          spec:
            gatewayClassName: "{{ gateway_class_name }}"
            listeners:
              - allowedRoutes:
                  namespaces:
                    from: Selector
                    selector:
                      matchLabels:
                        has-vice-routes: "true"
                hostname: "{{ vice_wildcard_fqdn }}"
                name: vice-http
                port: 8000
                protocol: HTTP
              - allowedRoutes:
                  namespaces:
                    from: Selector
                    selector:
                      matchLabels:
                        has-vice-routes: "true"
                hostname: "{{ vice_wildcard_fqdn }}"
                name: vice-https
                port: 8443
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      group: ""
                      name: "{{ vice_tls_cert_name }}"

    - name: Define the default route for VICE
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: vice-default-route
            namespace: "{{ ns }}"
          spec:
            hostnames:
              - "{{ vice_wildcard_fqdn }}"
            parentRefs:
              - name: vice
            rules:
              - backendRefs:
                  - name: vice-default-backend
                    port: 80
