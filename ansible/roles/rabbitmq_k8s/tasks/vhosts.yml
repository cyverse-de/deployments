---
# The rabbitmq-configure role drives rabbitmqctl over SSH against a host in the
# amqp-brokers group, so it cannot provision a broker running as a pod. These
# tasks run the same commands through the API server instead. Every rabbitmqctl
# subcommand used here is idempotent except add_vhost/add_user, whose
# already-exists exit is treated as success.
- name: Provision the vhosts and their users
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    - name: Find the rabbitmq pod
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ rabbitmq_k8s_namespace }}"
        label_selectors:
          - de-app=rabbitmq
        field_selectors:
          - status.phase=Running
      register: rabbitmq_pods
      until: rabbitmq_pods.resources | length > 0
      retries: 30
      delay: 10

    - name: Record the rabbitmq pod name
      ansible.builtin.set_fact:
        rabbitmq_pod_name: "{{ rabbitmq_pods.resources[0].metadata.name }}"

    - name: Create the vhosts
      kubernetes.core.k8s_exec:
        namespace: "{{ rabbitmq_k8s_namespace }}"
        pod: "{{ rabbitmq_pod_name }}"
        command: "rabbitmqctl add_vhost {{ item.vhost }}"
      register: rabbitmq_add_vhost
      changed_when: rabbitmq_add_vhost.rc == 0
      failed_when: rabbitmq_add_vhost.rc != 0 and 'already exists' not in rabbitmq_add_vhost.stderr
      loop: "{{ rabbitmq_k8s_vhosts }}"
      loop_control:
        label: "{{ item.vhost }}"

    - name: Create the vhost users
      kubernetes.core.k8s_exec:
        namespace: "{{ rabbitmq_k8s_namespace }}"
        pod: "{{ rabbitmq_pod_name }}"
        command: "rabbitmqctl add_user {{ item.user }} {{ item.password }}"
      register: rabbitmq_add_user
      changed_when: rabbitmq_add_user.rc == 0
      failed_when: rabbitmq_add_user.rc != 0 and 'already exists' not in rabbitmq_add_user.stderr
      no_log: true
      loop: "{{ rabbitmq_k8s_vhosts }}"
      loop_control:
        label: "{{ item.user }}"

    # add_user is skipped once the user exists, so the password is set
    # separately to keep the broker in step with the inventory.
    - name: Set the vhost user passwords
      kubernetes.core.k8s_exec:
        namespace: "{{ rabbitmq_k8s_namespace }}"
        pod: "{{ rabbitmq_pod_name }}"
        command: "rabbitmqctl change_password {{ item.user }} {{ item.password }}"
      no_log: true
      loop: "{{ rabbitmq_k8s_vhosts }}"
      loop_control:
        label: "{{ item.user }}"

    - name: Tag the vhost users as administrators
      kubernetes.core.k8s_exec:
        namespace: "{{ rabbitmq_k8s_namespace }}"
        pod: "{{ rabbitmq_pod_name }}"
        command: "rabbitmqctl set_user_tags {{ item.user }} administrator"
      loop: "{{ rabbitmq_k8s_vhosts }}"
      loop_control:
        label: "{{ item.user }}"

    - name: Grant the vhost users full permissions on their vhost
      kubernetes.core.k8s_exec:
        namespace: "{{ rabbitmq_k8s_namespace }}"
        pod: "{{ rabbitmq_pod_name }}"
        command: "rabbitmqctl set_permissions -p {{ item.vhost }} {{ item.user }} .* .* .*"
      loop: "{{ rabbitmq_k8s_vhosts }}"
      loop_control:
        label: "{{ item.user }}@{{ item.vhost }}"
