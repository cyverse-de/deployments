---
- name: Validate the TLS certificate parameters for {{ tls_certificate_name }}
  ansible.builtin.assert:
    that:
      - tls_certificate_name | length > 0
      - tls_certificate_namespace | length > 0
      - tls_certificate_hostnames | length > 0
      - tls_certificate_provider in ['selfsigned', 'letsencrypt', 'external']
      - tls_certificate_provider != 'selfsigned' or tls_certificate_issuer_name | length > 0
    fail_msg: >-
      tls_certificate needs tls_certificate_name, tls_certificate_namespace, and
      tls_certificate_hostnames; tls_certificate_provider must be 'selfsigned',
      'letsencrypt', or 'external' (got '{{ tls_certificate_provider }}'); and the
      selfsigned provider also needs tls_certificate_issuer_name.
    quiet: true

# Under the external provider an admin supplies the Secret, so there is
# nothing to create.
- name: Create the TLS certificate for {{ tls_certificate_name }}
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    - name: Define the self-signed CA certificate for {{ tls_certificate_name }}
      when:
        - tls_certificate_provider == 'selfsigned'
        - tls_certificate_ca_name | length > 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: "{{ tls_certificate_ca_name }}"
            namespace: "{{ tls_certificate_namespace }}"
          spec:
            isCA: true
            commonName: "{{ tls_certificate_ca_name }}"
            secretName: "{{ tls_certificate_ca_name }}"
            duration: "{{ tls_certificate_ca_duration }}"
            renewBefore: "{{ tls_certificate_ca_renew_before }}"
            privateKey:
              algorithm: ECDSA
              size: 256
            issuerRef:
              name: default-cluster-issuer
              kind: ClusterIssuer
              group: cert-manager.io

    - name: Create the local certificate issuer for {{ tls_certificate_name }}
      when:
        - tls_certificate_provider == 'selfsigned'
        - tls_certificate_ca_name | length > 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: "{{ tls_certificate_issuer_name }}"
            namespace: "{{ tls_certificate_namespace }}"
          spec:
            ca:
              secretName: "{{ tls_certificate_ca_name }}"

    - name: Create the locally signed TLS certificate for {{ tls_certificate_name }}
      when: tls_certificate_provider == 'selfsigned'
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: "{{ tls_certificate_name }}"
            namespace: "{{ tls_certificate_namespace }}"
          spec:
            secretName: "{{ tls_certificate_name }}"
            duration: "{{ tls_certificate_duration }}"
            renewBefore: "{{ tls_certificate_renew_before }}"
            issuerRef:
              name: "{{ tls_certificate_issuer_name }}"
              kind: Issuer
            commonName: "{{ tls_certificate_selfsigned_common_name }}"
            dnsNames: "{{ tls_certificate_selfsigned_dns_names }}"

    - name: Create the Let's Encrypt TLS certificate for {{ tls_certificate_name }}
      when: tls_certificate_provider == 'letsencrypt'
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: "{{ tls_certificate_name }}"
            namespace: "{{ tls_certificate_namespace }}"
          spec:
            secretName: "{{ tls_certificate_name }}"
            duration: "{{ tls_certificate_duration }}"
            renewBefore: "{{ tls_certificate_renew_before }}"
            issuerRef:
              name: "{{ cert_manager_le_issuer_name }}"
              kind: ClusterIssuer
            commonName: "{{ tls_certificate_hostnames[0] }}"
            dnsNames: "{{ tls_certificate_hostnames }}"
