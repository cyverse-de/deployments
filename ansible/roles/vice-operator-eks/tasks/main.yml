---
- name: validate eks_cert_provider
  ansible.builtin.assert:
    that: eks_cert_provider in ['letsencrypt', 'external']
    fail_msg: >-
      eks_cert_provider must be 'letsencrypt' or 'external',
      got '{{ eks_cert_provider }}'.

- name: validate external cert file paths
  when: eks_cert_provider == 'external'
  ansible.builtin.assert:
    that:
      - eks_external_cert_file | length > 0
      - eks_external_key_file | length > 0
    fail_msg: >-
      eks_cert_provider is 'external' but eks_external_cert_file or
      eks_external_key_file is empty. Set both to readable PEM file paths
      on the Ansible controller.

- delegate_to: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    #- name: render the template
    #  ansible.builtin.template:
    #    src: cluster_config.yaml.j2
    #    dest: "/tmp/cluster_config.yaml"

    #- name: create the cluster
    #  ansible.builtin.shell:
    #    cmd: "eksctl create cluster --kubeconfig {{ lookup('env', 'KUBECONFIG') }} -f /tmp/cluster_config.yaml"
    #  register: cluster_created

    - name: create the gp3 storage class
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: "{{ storage_class_name }}"
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
          provisioner: ebs.csi.eks.amazonaws.com
          volumeBindingMode: WaitForFirstConsumer
          parameters:
            type: gp3
            encrypted: "true"

- ansible.builtin.include_tasks: nodepools.yml

- ansible.builtin.include_tasks: cert_manager.yml

- ansible.builtin.include_tasks: traefik.yml
