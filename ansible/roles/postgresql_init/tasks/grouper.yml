---
- name: Initialize grouper database
  delegate_to: localhost
  block:
    - name: Create the grouper user
      community.postgresql.postgresql_user:
        login_host: "{{ db_login_host }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ pg_db }}"
        name: "{{ grouper_connection_user }}"
        password: "{{ grouper_connection_pass }}"
        # Named explicitly because the module reconciles only the attributes it
        # is given: a role left over without LOGIN keeps its password set and
        # still cannot connect. See the keycloak role for the failure it causes.
        role_attr_flags: LOGIN
      when: create_user is defined and create_user
      tags:
        - update-databases

    - name: Create grouper database
      community.postgresql.postgresql_db:
        login_host: "{{ db_login_host }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        name: "{{ grouper_db_name }}"
        owner: "{{ grouper_connection_user }}"
        encoding: "{{ encoding }}"
        locale_provider: "icu"
        icu_locale: "{{ icu_locale }}"
        template: "{{ template }}"
      when: create_dbs is defined and create_dbs
