---
- name: Initialize keycloak database
  delegate_to: localhost
  block:
    - name: Create the keycloak user
      community.postgresql.postgresql_user:
        login_host: "{{ groups['keycloak_dbms'][0] }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ pg_db }}"
        name: "{{ keycloak_db_username }}"
        password: "{{ keycloak_db_password }}"
        # Stated explicitly because the module only reconciles the attributes
        # it is given. A role left over from earlier work can already exist
        # without LOGIN, in which case the password below is set correctly and
        # Keycloak still cannot connect — it crashloops on "password
        # authentication failed", which points nowhere near the real cause.
        role_attr_flags: LOGIN
      when: create_user is defined and create_user
      tags:
        - update-databases

    - name: Create the keycloak database
      community.postgresql.postgresql_db:
        login_host: "{{ groups['keycloak_dbms'][0] }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        name: "{{ keycloak_db_name }}"
        owner: "{{ keycloak_db_username }}"
        encoding: "{{ encoding }}"
        locale_provider: "icu"
        icu_locale: "{{ icu_locale }}"
        template: "{{ template }}"
      when: create_dbs is defined and create_dbs
