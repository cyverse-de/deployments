---
# One database server's worth of the locale-provider check. Included per entry
# in postgresql_init_preflight_targets; see preflight.yml for why.
- name: "Check the locale provider of the DE databases on {{ postgresql_init_target.host }}"
  delegate_to: localhost
  when: postgresql_init_target.databases | length > 0
  block:
    - name: Look up the locale provider of every database on the server
      community.postgresql.postgresql_query:
        login_host: "{{ postgresql_init_target.host }}"
        login_port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ pg_db }}"
        query: SELECT datname, datlocprovider FROM pg_database WHERE NOT datistemplate
      register: postgresql_init_existing_dbs

    - name: Fail if a pre-existing database was not created with the ICU provider
      ansible.builtin.fail:
        msg: >-
          {{ mismatched | join(', ') }} on {{ postgresql_init_target.host }}
          already exist(s) without the ICU locale provider. A database's locale
          provider cannot be changed after creation, so this role cannot
          reconcile it — drop the database (dump it first if it holds anything
          worth keeping) and re-run.
      vars:
        mismatched: >-
          {{ postgresql_init_existing_dbs.query_result
             | selectattr('datname', 'in', postgresql_init_target.databases)
             | rejectattr('datlocprovider', 'eq', 'i')
             | map(attribute='datname') | list }}
      when: mismatched | length > 0
