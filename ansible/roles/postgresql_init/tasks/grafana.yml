---
- name: Initialize grafana database
  delegate_to: localhost
  block:
    - name: Create the grafana database user
      community.postgresql.postgresql_user:
        login_host: "{{ groups['dbms'][0] }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ pg_db }}"
        name: "{{ grafana_db_user }}"
        password: "{{ grafana_db_password }}"
      when: create_user is defined and create_user
      tags:
        - grafana
        - update-databases

    # Grafana queries the DE database through this role rather than the
    # read-write de account, because anyone with the Grafana admin password can
    # run arbitrary SQL through the datasource. It gets SELECT on the two tables
    # the dashboards read and nothing else.
    - name: Create the grafana read-only database user
      community.postgresql.postgresql_user:
        login_host: "{{ groups['dbms'][0] }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ pg_db }}"
        name: "{{ grafana_ro_db_user }}"
        password: "{{ grafana_ro_db_password }}"
        role_attr_flags: NOCREATEDB,NOCREATEROLE,NOSUPERUSER
      when: create_user is defined and create_user
      tags:
        - grafana
        - update-databases

    # Grafana manages its own schema on first startup, so there are no
    # migrations to run against this database.
    - name: Create the grafana database
      community.postgresql.postgresql_db:
        login_host: "{{ groups['dbms'][0] }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        name: "{{ grafana_db_name }}"
        owner: "{{ grafana_db_user }}"
        encoding: "{{ encoding }}"
        locale_provider: "icu"
        icu_locale: "{{ icu_locale }}"
        template: "{{ template }}"
      when: create_dbs is defined and create_dbs
      tags:
        - grafana
        - update-databases

    - name: Allow the grafana read-only user to connect to the de database
      community.postgresql.postgresql_privs:
        login_host: "{{ groups['dbms'][0] }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ de_db_name }}"
        type: database
        objs: "{{ de_db_name }}"
        privs: CONNECT
        role: "{{ grafana_ro_db_user }}"
      tags:
        - grafana
        - update-databases

    - name: Allow the grafana read-only user to use the public schema
      community.postgresql.postgresql_privs:
        login_host: "{{ groups['dbms'][0] }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ de_db_name }}"
        type: schema
        objs: public
        privs: USAGE
        role: "{{ grafana_ro_db_user }}"
      tags:
        - grafana
        - update-databases

    - name: Grant the grafana read-only user access to the dashboard tables
      community.postgresql.postgresql_privs:
        login_host: "{{ groups['dbms'][0] }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ de_db_name }}"
        type: table
        schema: public
        objs: "{{ grafana_ro_db_tables | join(',') }}"
        privs: SELECT
        role: "{{ grafana_ro_db_user }}"
      tags:
        - grafana
        - update-databases

    # postgresql_privs has no column-level grants, so these are plain SQL. GRANT
    # is idempotent, but the task reports changed on every run.
    - name: Grant the grafana read-only user access to the dashboard columns
      community.postgresql.postgresql_query:
        login_host: "{{ groups['dbms'][0] }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ de_db_name }}"
        query: >-
          GRANT SELECT ({{ item.value | join(', ') }})
          ON public.{{ item.key }} TO {{ grafana_ro_db_user }}
      loop: "{{ grafana_ro_db_columns | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      tags:
        - grafana
        - update-databases

    # The dashboards split usage into University of Arizona and other users by
    # verified email address, which lives in the portal database. postgres_fdw
    # exposes just that in the DE database as grafana.ua_users; see the template
    # for why the objects are laid out the way they are. It needs the portal
    # database to exist, so it's skipped when this deployment doesn't have one.
    - name: Install postgres_fdw in the de database
      when: portal and install_exts is defined and install_exts
      community.postgresql.postgresql_ext:
        login_host: "{{ groups['dbms'][0] }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ de_db_name }}"
        name: postgres_fdw
      tags:
        - grafana
        - update-databases

    # Reports changed on every run, because the view is dropped and recreated.
    # no_log because the module returns the executed query, which includes the
    # user mapping's password.
    - name: Create the University of Arizona user view for grafana
      when: portal
      no_log: true
      community.postgresql.postgresql_query:
        login_host: "{{ groups['dbms'][0] }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ de_db_name }}"
        query: "{{ lookup('template', 'grafana_ua_users.sql.j2') }}"
        named_args:
          host: "{{ grafana_portal_fdw_host }}"
          port: "{{ pg_listen_port | string }}"
          dbname: "{{ portal_db_name }}"
          user: "{{ pg_login_user }}"
          password: "{{ pg_login_password }}"
          uid_domain: "{{ uid_domain }}"
          # Two strings rather than a list: the module renders a list as an array
          # literal with the quotes left inside each element.
          domain_pattern: "%@{{ grafana_ua_email_domain | lower }}"
          subdomain_pattern: "%.{{ grafana_ua_email_domain | lower }}"
      tags:
        - grafana
        - update-databases
