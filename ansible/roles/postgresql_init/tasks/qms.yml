---
- name: Initialize qms database
  delegate_to: localhost
  block:
    - name: Create qms database
      community.postgresql.postgresql_db:
        login_host: "{{ db_login_host }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        name: "{{ qms_db_name }}"
        owner: "{{ dbms_connection_user }}"
        encoding: "{{ encoding }}"
        locale_provider: "icu"
        icu_locale: "{{ icu_locale }}"
        template: "{{ template }}"
      when: create_dbs is defined and create_dbs

    - name: Install extensions for the qms database
      when: install_exts is defined and install_exts
      community.postgresql.postgresql_ext:
        login_host: "{{ db_login_host }}"
        port: "{{ pg_listen_port }}"
        login_user: "{{ pg_login_user }}"
        login_password: "{{ pg_login_password }}"
        login_db: "{{ qms_db_name }}"
        name: "{{ item }}"
      loop:
        - uuid-ossp
        - moddatetime
        - btree_gist
        - insert_username
      tags:
        - update-databases

    # The qms database schema is owned by the subscriptions repo now; the QMS
    # service that used to hold these migrations has been merged into it.
    - name: Checkout the subscriptions repo for the qms migrations
      ansible.builtin.git:
        repo: "https://github.com/cyverse-de/subscriptions"
        dest: "{{ dbs_dir.path }}/subscriptions"
        clone: true
        update: true
        force: true
        version: "{{ subscriptions_version }}"
      tags:
        - update-databases

    - name: Run the qms migrations from the subscriptions repo
      ansible.builtin.command: >
        {{ migrate_installed.stdout }}
        -database "postgresql://{{ dbms_connection_user }}:{{ dbms_connection_pass }}@{{ db_login_host }}:{{ pg_listen_port }}/{{ qms_db_name }}?sslmode=disable"
        -path "{{ dbs_dir.path }}/subscriptions/migrations"
        up
      when: migrate is defined and migrate
      tags:
        - update-databases
