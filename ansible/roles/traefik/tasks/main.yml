---
- name: Install and configure traefik
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    - name: Create traefik namespace
      kubernetes.core.k8s:
        name: "{{ traefik_namespace }}"
        state: present
        kind: namespace
        api_version: v1

    - name: Create the self-signed CA certificate for traefik
      kubernetes.core.k8s:
        name: "{{ traefik_ca_name }}"
        namespace: "{{ traefik_namespace }}"
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: "{{ traefik_ca_name }}"
          spec:
            isCA: true
            commonName: "{{ traefik_ca_name }}"
            secretName: "{{ traefik_ca_name }}"
            duration: "{{ traefik_ca_duration }}"
            renewBefore: "{{ traefik_ca_renew_before }}"
            privateKey:
              algorithm: ECDSA
              size: 256
            issuerRef:
              name: default-cluster-issuer
              kind: ClusterIssuer
              group: cert-manager.io

    - name: Create the certificate issuer for traefik
      kubernetes.core.k8s:
        name: "{{ traefik_issuer_name }}"
        namespace: "{{ traefik_namespace }}"
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: "{{ traefik_issuer_name }}"
          spec:
            ca:
              secretName: "{{ traefik_ca_name }}"

    - name: Create the TLS certificate for traefik
      kubernetes.core.k8s:
        name: "{{ traefik_cert_name }}"
        namespace: "{{ traefik_namespace }}"
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: "{{ traefik_cert_name }}"
          spec:
            secretName: "{{ traefik_cert_name }}"
            duration: "{{ traefik_cert_duration }}"
            renewBefore: "{{ traefik_cert_renew_before }}"
            issuerRef:
              name: "{{ traefik_issuer_name }}"
              kind: Issuer
            commonName: "*.{{ traefik_namespace }}.svc.cluster.local"
            dnsNames:
              - localhost
              - "{{ ui_wildcard_fqdn }}"
              - "{{ vice_wildcard_fqdn }}"
              - "{{ vice_base_domain }}"

    - name: Install traefik repo
      kubernetes.core.helm_repository:
        name: traefik
        repo_url: https://traefik.github.io/charts

    - name: Install traefik
      kubernetes.core.helm:
        name: traefik
        chart_ref: traefik/traefik
        release_namespace: "{{ traefik_namespace }}"
        values:
          gateway:
            listeners:
              web:
                namespacePolicy:
                  from: "All"
          ingressRoute:
            dashboard:
              enabled: true
              matchRule: "Host(`dashboard.localhost`)"
              entryPoints:
                - "web"
                - "websecure"
          ports:
            web:
              http:
                encodedCharacters:
                  allowEncodedSlash: true # Required for VICE loading page
              transport:
                respondingTimeouts:
                  readTimeout: "24h"
                  writeTimeout: "24h"
              port: 8000
              exposedPort: 80
              nodePort: "{{ traefik_http_port }}"
            websecure:
              http:
                encodedCharacters:
                  allowEncodedSlash: true # Required for VICE loading page
              transport:
                respondingTimeouts:
                  readTimeout: "24h"
                  writeTimeout: "24h"
              port: 8443
              exposedPort: 443
              nodePort: "{{ traefik_https_port }}"
            traefik:
              port: 9000
              exposedPort: 9000
              nodePort: 31390
          providers:
            kubernetesGateway:
              enabled: true
          service:
            type: NodePort
            # A fixed ClusterIP lets hostnames be derived from it — a
            # magic-DNS domain such as sslip.io encodes the address in the
            # name, so the address has to stop moving. Empty leaves the
            # cluster to assign one. ClusterIP is immutable, so changing this
            # on an existing release needs the Service deleted first.
            spec: "{{ {'clusterIP': traefik_cluster_ip} if traefik_cluster_ip | default('', true) | length > 0 else {} }}"
          tlsStore:
            default:
              defaultCertificate:
                secretName: "{{ traefik_cert_name }}"

    # Applied after the chart, not before it. The chart bundles its own copy of
    # these CRDs and has to install them to render its own Gateway object, but
    # its apply conflicts with whatever field manager got there first, which
    # aborts the release on a fresh cluster. Letting the chart go first and
    # re-asserting the pinned version here keeps both happy.
    #
    # Traefik v3.7's Gateway provider targets Gateway API v1.5.1 and watches
    # TLSRoute at startup (WaitForCacheSync blocks on it even when unused). In
    # v1.5.1 TLSRoute is in the standard channel, so standard-install is
    # sufficient; the CRD version must stay in step with the Traefik version.
    #
    # standard-install also creates a ValidatingAdmissionPolicy that rejects
    # any Gateway API CRD older than v1.5.0 — including the set the chart
    # bundles. That is harmless while it stays in step with the CRDs, but it
    # outlives them: a teardown that removes the CRDs and leaves the policy
    # blocks the chart on the next install, so local-teardown.yml removes it by
    # name in local_teardown_admission_policy_names.
    - name: Pin the Gateway API CRDs
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: deployments-traefik-role
          force_conflicts: true
        src: https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_crd_version }}/standard-install.yaml
