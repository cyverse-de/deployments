---
- name: Deploy Grafana
  delegate_to: localhost
  run_once: true
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    - name: Create the grafana namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ grafana_namespace }}"

    - name: Create the grafana admin secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-admin
            namespace: "{{ grafana_namespace }}"
            labels:
              app: grafana
          type: Opaque
          data:
            admin-user: "{{ grafana_admin_user | b64encode }}"
            admin-password: "{{ grafana_admin_password | b64encode }}"

    # The chart renders both grafana.ini and the datasource provisioning file
    # into ConfigMaps, so neither password can be given to it literally. They're
    # injected as environment variables instead: Grafana reads
    # GF_DATABASE_PASSWORD for its own state database, and expands
    # $__env{DE_DB_PASSWORD} in the provisioning file at load time.
    - name: Create the grafana database secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-db
            namespace: "{{ grafana_namespace }}"
            labels:
              app: grafana
          type: Opaque
          data:
            state-password: "{{ grafana_db_password | b64encode }}"
            de-ro-password: "{{ grafana_ro_db_password | b64encode }}"

    - name: Create the grafana oauth secret
      when: grafana_external_access | bool
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-oauth
            namespace: "{{ grafana_namespace }}"
            labels:
              app: grafana
          type: Opaque
          data:
            client-secret: "{{ grafana_keycloak_client_secret | b64encode }}"

    - name: Create the DE dashboards config map
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-de-dashboards
            namespace: "{{ grafana_namespace }}"
            labels:
              app: grafana
          data:
            de-logins.json: "{{ lookup('file', 'dashboards/de-logins.json') }}"

    - name: Assemble the base grafana.ini and environment
      ansible.builtin.set_fact:
        grafana_ini:
          database:
            type: postgres
            host: "{{ groups['dbms'][0] }}:{{ pg_listen_port }}"
            name: "{{ grafana_db_name }}"
            user: "{{ grafana_db_user }}"
            ssl_mode: disable
          users:
            allow_sign_up: "{{ grafana_allow_sign_up }}"
          auth.anonymous:
            enabled: false
        grafana_env_value_from:
          GF_DATABASE_PASSWORD:
            secretKeyRef:
              name: grafana-db
              key: state-password
          DE_DB_PASSWORD:
            secretKeyRef:
              name: grafana-db
              key: de-ro-password

    # Keycloak login, restricted by the entitlement claim. The role expression
    # is JMESPath over the ID token and userinfo claims; `entitlement || []`
    # keeps contains() from failing for a user with no groups at all.
    - name: Add Keycloak login to grafana.ini and environment
      when: grafana_external_access | bool
      vars:
        oidc_base: "{{ keycloak_server_uri }}/realms/{{ keycloak_realm_name }}/protocol/openid-connect"
        role_rules: >-
          {{ (grafana_oauth_admin_groups | product(['Admin']) | list)
             + (grafana_oauth_editor_groups | product(['Editor']) | list) }}
        role_attribute_path: >-
          {% for rule in role_rules %}contains(entitlement || `[]`, '{{ rule[0] }}') && '{{ rule[1] }}' || {% endfor %}'{{ grafana_oauth_default_role }}'
      ansible.builtin.set_fact:
        grafana_ini: >-
          {{ grafana_ini | combine({
               'server': {
                 'domain': grafana_hostname,
                 'root_url': grafana_base_uri,
               },
               'auth': {
                 'login_maximum_lifetime_duration': grafana_login_maximum_lifetime_duration,
                 'signout_redirect_url': oidc_base ~ '/logout?client_id=' ~ grafana_keycloak_client_id
                   ~ '&post_logout_redirect_uri=' ~ ((grafana_base_uri ~ '/login') | urlencode),
               },
               'auth.generic_oauth': {
                 'enabled': true,
                 'name': 'CyVerse',
                 'allow_sign_up': true,
                 'client_id': grafana_keycloak_client_id,
                 'scopes': 'openid profile email',
                 'auth_url': oidc_base ~ '/auth',
                 'token_url': oidc_base ~ '/token',
                 'api_url': oidc_base ~ '/userinfo',
                 'use_pkce': true,
                 'use_refresh_token': true,
                 'login_attribute_path': 'preferred_username',
                 'email_attribute_path': 'email',
                 'name_attribute_path': 'name',
                 'groups_attribute_path': 'entitlement',
                 'allowed_groups': grafana_oauth_allowed_groups | join(','),
                 'role_attribute_path': role_attribute_path,
                 'tls_skip_verify_insecure': grafana_oauth_tls_skip_verify | bool,
               },
             }) }}
        grafana_env_value_from: >-
          {{ grafana_env_value_from | combine({
               'GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET': {
                 'secretKeyRef': {'name': 'grafana-oauth', 'key': 'client-secret'},
               },
             }) }}

    - name: Add the grafana helm repository
      kubernetes.core.helm_repository:
        name: grafana
        repo_url: "{{ grafana_repo }}"
        state: present

    - name: Install the grafana helm chart
      kubernetes.core.helm:
        name: grafana
        chart_ref: grafana/grafana
        chart_version: "{{ grafana_chart_version }}"
        create_namespace: true
        release_namespace: "{{ grafana_namespace }}"
        wait: true
        values:
          replicas: "{{ grafana_replicas }}"

          # State lives in PostgreSQL, so there is nothing durable on disk.
          persistence:
            enabled: false

          service:
            type: ClusterIP

          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password

          envValueFrom: "{{ grafana_env_value_from }}"

          resources:
            requests:
              cpu: "{{ grafana_cpu_request }}"
              memory: "{{ grafana_mem_request }}"
              ephemeral-storage: "{{ grafana_ephemeral_request }}"
            limits:
              cpu: "{{ grafana_cpu_limit }}"
              memory: "{{ grafana_mem_limit }}"
              ephemeral-storage: "{{ grafana_ephemeral_limit }}"

          grafana.ini: "{{ grafana_ini }}"

          # The DE database, queried with a role that can only SELECT from
          # public.logins and public.users.
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: DE
                  uid: de-postgres
                  type: postgres
                  isDefault: true
                  url: "{{ groups['dbms'][0] }}:{{ pg_listen_port }}"
                  user: "{{ grafana_ro_db_user }}"
                  secureJsonData:
                    password: "$__env{DE_DB_PASSWORD}"
                  # database belongs under jsonData. A top-level `database:` only
                  # populates the deprecated data_source.database column: the
                  # backend falls back to it so queries still work, but the UI
                  # reads jsonData.database, so the datasource shows up with no
                  # database configured and can't be used from a dashboard.
                  jsonData:
                    database: "{{ de_db_name }}"
                    sslmode: disable
                    postgresVersion: "{{ grafana_de_postgres_version }}"

          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: de
                  orgId: 1
                  folder: Discovery Environment
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/de

          dashboardsConfigMaps:
            de: grafana-de-dashboards

    - name: Wait for the grafana deployment to be available
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: "{{ grafana_namespace }}"
        name: grafana
        wait: true
        wait_timeout: 300
        wait_condition:
          type: Available
          status: "True"
          reason: MinimumReplicasAvailable

    # TLS terminates at the gateway, the same way it does for Keycloak. HAProxy
    # passes 443 straight through to Traefik, so the hostname needs only a DNS
    # record pointing at the proxy.
    - name: Expose grafana through a gateway
      when: grafana_external_access | bool
      block:
        - name: Create the grafana self-signed CA certificate
          when: cert_manager_provider == 'selfsigned'
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: grafana-selfsigned-ca
                namespace: "{{ grafana_namespace }}"
              spec:
                isCA: true
                commonName: grafana-selfsigned-ca
                secretName: grafana-selfsigned-ca
                duration: "{{ grafana_cert_duration }}"
                renewBefore: "{{ grafana_cert_renew_before }}"
                privateKey:
                  algorithm: ECDSA
                  size: 256
                issuerRef:
                  name: default-cluster-issuer
                  kind: ClusterIssuer
                  group: cert-manager.io

        - name: Create the grafana CA issuer
          when: cert_manager_provider == 'selfsigned'
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: cert-manager.io/v1
              kind: Issuer
              metadata:
                name: grafana-ca-issuer
                namespace: "{{ grafana_namespace }}"
              spec:
                ca:
                  secretName: grafana-selfsigned-ca

        - name: Create the grafana TLS certificate
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: grafana-tls
                namespace: "{{ grafana_namespace }}"
              spec:
                secretName: grafana-tls
                duration: "{{ grafana_cert_duration }}"
                renewBefore: "{{ grafana_cert_renew_before }}"
                issuerRef:
                  name: "{{ 'grafana-ca-issuer' if cert_manager_provider == 'selfsigned' else cert_manager_le_issuer_name }}"
                  kind: "{{ 'Issuer' if cert_manager_provider == 'selfsigned' else 'ClusterIssuer' }}"
                commonName: "{{ grafana_hostname }}"
                dnsNames:
                  - "{{ grafana_hostname }}"

        - name: Create the gateway for grafana
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: gateway.networking.k8s.io/v1
              kind: Gateway
              metadata:
                name: grafana
                namespace: "{{ grafana_namespace }}"
              spec:
                gatewayClassName: "{{ gateway_class_name }}"
                listeners:
                  - hostname: "{{ grafana_hostname }}"
                    name: grafana-https
                    port: 8443
                    protocol: HTTPS
                    tls:
                      certificateRefs:
                        - kind: Secret
                          group: ""
                          name: grafana-tls

        - name: Define the route for grafana
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: grafana
                namespace: "{{ grafana_namespace }}"
              spec:
                hostnames:
                  - "{{ grafana_hostname }}"
                parentRefs:
                  - name: grafana
                rules:
                  - backendRefs:
                      - name: grafana
                        port: 80
