---
- delegate_to: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    - name: create the portal2-configs secret
      run_once: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: portal2-configs
            namespace: "{{ ns }}"
          data:
            # Before ansible-core 2.19 the lookup parses rendered JSON into a dict, which b64encode stringifies as a Python repr.
            portal2.json: "{{ lookup('template', 'portal2.json.j2', convert_data=False) | b64encode }}"
      when: load_configs is undefined or (load_configs | bool)

    - ansible.builtin.include_role:
        name: deploy-service
        tasks_from: main
      vars:
        project_name: portal2
