---
- name: deploy ai-sandboxes-ui
  when: ai_sandboxes_ui_enabled | bool
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    - name: create the ai-sandboxes-ui-configs secret
      run_once: true
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ai-sandboxes-ui-configs
            namespace: "{{ ns }}"
          data:
            AI2S_TERRAIN_BASE_URL: "{{ ai2s_terrain_base_url | b64encode }}"
            AI2S_KEYCLOAK_ISSUER: "{{ ai2s_keycloak_issuer | b64encode }}"
            AI2S_KEYCLOAK_CLIENT_ID: "{{ ai2s_keycloak_client_id | b64encode }}"
            AI2S_KEYCLOAK_CLIENT_SECRET: "{{ ai2s_keycloak_client_secret | b64encode }}"
            AI2S_ADMIN_GROUPS: "{{ ai2s_admin_groups | b64encode }}"
            NEXTAUTH_URL: "{{ ai2s_nextauth_url | b64encode }}"
            NEXTAUTH_SECRET: "{{ ai2s_nextauth_secret | b64encode }}"
            AI2S_LOG_LEVEL: "{{ ai2s_log_level | b64encode }}"
            AI2S_LOG_LABEL: "{{ ai2s_log_label | b64encode }}"
      when: load_configs is undefined or (load_configs | bool)

    - ansible.builtin.include_role:
        name: deploy-service
        tasks_from: main
      vars:
        project_name: ai-sandboxes-ui
