apiVersion: skaffold/v3
kind: Config
metadata:
  name: data-info-next
build:
  artifacts:
    - image: harbor.cyverse.org/de/data-info-next
      # skaffold's own docker builder rather than the shared buildx-build.sh every other
      # service uses. That script hardcodes --file "$BUILD_CONTEXT/Dockerfile", and this
      # image is built from Dockerfile.golang -- the Clojure service's Dockerfile is still
      # the one at the plain name until cutover, when this reverts to the shared builder.
      docker:
        dockerfile: Dockerfile.golang
        # The Go binary reports its version from a linker-stamped variable, so
        # unlike the JVM services it has nowhere else to get one -- without these
        # it answers "unknown" to GET / and --version. build-service exports both;
        # the else branches keep a bare `skaffold build` working outside ansible.
        buildArgs:
          descriptive_version: "{{if .DESCRIPTIVE_VERSION}}{{.DESCRIPTIVE_VERSION}}{{else}}unknown{{end}}"
          version: "{{if .DESCRIPTIVE_VERSION}}{{.DESCRIPTIVE_VERSION}}{{else}}unknown{{end}}"
          git_commit: "{{if .GIT_COMMIT}}{{.GIT_COMMIT}}{{else}}unknown{{end}}"
  tagPolicy:
    gitCommit: {}
  local: {}
  platforms:
    - "linux/amd64"
manifests:
  rawYaml:
    - k8s/data-info-next.yml
deploy:
  kubectl: {}
