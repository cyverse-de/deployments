---
groups_replicas: 2
groups_pod_anti_affinity: true

# The Grouper importer runs as a CronJob. It is created suspended and stays that
# way: the cutover ships in a single maintenance window, so nothing reads the
# imported rows before the window, and grouper_cutover.yml refuses to flip the
# marker while the CronJob is unsuspended. The one case that resumes it is the
# rollback where permissions keeps its new image while the rest of the DE runs
# against Grouper -- see docs/production-release.md.
grouper_import_suspended: true
grouper_import_schedule: "*/15 * * * *"
grouper_import_phase: all
