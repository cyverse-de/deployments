---
- delegate_to: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    - name: create the groups-configs secret
      run_once: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: groups-configs
            namespace: "{{ ns }}"
          data:
            groups.yml: "{{ lookup('template', 'groups.yml.j2') | b64encode }}"
      when: load_configs is undefined or (load_configs | bool)

    - ansible.builtin.include_role:
        name: deploy-service
        tasks_from: main
      vars:
        project_name: groups

- name: deploy the Grouper importer
  ansible.builtin.include_tasks: import.yml
  tags:
    - grouper-import
