---
- name: Install the OpenEBS local storage provider
  delegate_to: localhost
  run_once: true
  when: openebs_enabled | bool
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    # Applies the vendored OpenEBS operator plus the discoenv overlay, which patches
    # vice/analysis NoSchedule tolerations onto the NDM and localpv workloads. Creates
    # the openebs-hostpath StorageClass the VICE operator uses (vice_local_storage_class).
    # Waits for the workloads so later roles can provision PVCs against the StorageClass
    # without racing the localpv provisioner on a fresh cluster.
    - name: Apply the OpenEBS kustomization
      kubernetes.core.k8s:
        state: present
        apply: true
        wait: true
        wait_timeout: 600
        definition: "{{ lookup('kubernetes.core.kustomize', dir=role_path ~ '/files/discoenv') }}"

    # Most DE PVCs name their StorageClass, but openldap-docker's volume claim
    # template does not, so on a cluster whose only storage is OpenEBS its PVC
    # pends forever unless something is marked default. Longhorn takes the
    # default itself, hence the opt-in.
    - name: Mark openebs-hostpath as the default StorageClass
      when: openebs_default_storage_class | bool
      kubernetes.core.k8s:
        state: patched
        kind: StorageClass
        name: openebs-hostpath
        definition:
          metadata:
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
