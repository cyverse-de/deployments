---
- name: deploy services
  hosts: k8s_controllers[0]
  connection: local
  gather_facts: false
  become: false
  roles:
    - role: services/maintenance-page
      tags: maintenance-page
    - role: services/analyses
      tags: analyses
    - role: services/app-exposer
      tags: app-exposer
    - role: services/apps
      tags: apps
    - role: services/async-tasks
      tags: async-tasks
    - role: services/bulk-typer
      tags: bulk-typer
    - role: services/clockwork
      tags: clockwork
    - role: services/data-info
      tags: data-info
    - role: services/de-mailer
      tags: de-mailer
    - role: services/de-webhooks
      tags: de-webhooks
    - role: services/dewey
      tags: dewey
    - role: services/event-recorder
      tags: event-recorder
    - role: services/info-typer
      tags: info-typer
    - role: services/infosquito2
      tags: infosquito2
    - role: services/iplant-groups
      tags: iplant-groups
    - role: services/job-status
      tags: job-status
    - role: services/kifshare
      tags: kifshare
    - role: services/metadata
      tags: metadata
    - role: services/notifications
      tags: notifications
    - role: services/openldap-docker
      tags: openldap-docker
    - role: services/permissions
      tags: permissions
    - role: services/requests
      tags: requests
    - role: services/resource-usage-api
      tags: resource-usage-api
    - role: services/subscriptions
      tags: subscriptions
    - role: services/user-info
      tags: user-info
    - role: services/vice-default-backend
      tags: vice-default-backend
    - role: services/search
      tags: search
    - role: services/dashboard-aggregator
      tags: dashboard-aggregator
    - role: services/terrain
      tags: terrain
    - role: services/sonora
      tags: sonora
    - role: services/group-propagator
      tags: group-propagator
    - role: services/portal-conductor
      tags: portal-conductor
    - role: services/portal2
      tags: portal2
    - role: services/formation
      tags: formation
    - role: services/vice-operator
      tags: vice-operator

  # Runs whatever the roles above left behind, including after a failure, so a
  # broken service is reported alongside the state of everything else rather
  # than as an abort partway down the list.
  post_tasks:
    # With deploy_wait: false the roles only applied their manifests. One wait
    # covering every Deployment at once replaces the per-service waits they
    # would otherwise have blocked on individually.
    - name: Wait for the deployments to become available
      delegate_to: localhost
      when: not (deploy_wait | default(true) | bool)
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: "{{ ns }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: "{{ deploy_wait_timeout | default(900) }}"
      register: deploy_wait_result
      failed_when: false

    - name: Report deployments that never became available
      delegate_to: localhost
      when:
        - not (deploy_wait | default(true) | bool)
        - deploy_wait_result.resources is defined
      vars:
        # availableReplicas is omitted entirely while a Deployment has none,
        # which is the state worth naming after the wait has already timed out.
        unavailable: >-
          {{ deploy_wait_result.resources
             | selectattr('status.availableReplicas', 'undefined')
             | map(attribute='metadata.name') | list }}
      ansible.builtin.debug:
        msg: >-
          Deployments with no available replicas:
          {{ unavailable | join(', ') if unavailable | length > 0 else 'none' }}

    - name: Fail if any service failed to deploy
      delegate_to: localhost
      when: deploy_failed_services | default([]) | length > 0
      ansible.builtin.fail:
        msg: >-
          {{ deploy_failed_services | length }} service(s) failed to deploy:
          {{ deploy_failed_services | join(', ') }}.
          The rest of the list was deployed; re-run with --tags <service> after fixing.
